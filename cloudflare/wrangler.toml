name = "preface-fitness-api"
main = "worker/index.js"
compatibility_date = "2026-11-14"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "preface-fitness"
database_id = "b4ef404a-af0a-4941-8930-dea66663e7b1"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LIVE_ROOMS"
class_name = "GymLiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GymLiveRoom"]

[vars]
APP_ORIGIN = "http://127.0.0.1:5173,http://localhost:5173,https://noscodera.github.io"
TOKEN_TTL_SECONDS = "604800"
