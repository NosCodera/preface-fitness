<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f9d8f" />
    <meta name="description" content="Preface Fitness gym management" />
    <title>Preface Fitness — Gym Management</title>
  </head>
  <body>
    <script>
      // Keep one canonical browser origin so localStorage and IndexedDB never split.
      if (location.hostname === '127.0.0.1') {
        location.replace(location.protocol + '//localhost' + location.port.replace(/^/, ':') + location.pathname + location.search + location.hash);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
